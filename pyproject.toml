[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gelation-sim"
version = "0.1.0"
description = "Reproducible coarse-grained radical polymer network formation"
readme = "README.md"
requires-python = "==3.11"
dependencies = [
    "numpy>=1.24, <2.5.0",
    "scipy>=1.10,<2",
    "matplotlib >= 3.6.1, < 3.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.2", "pycodestyle>=2.9.0"]

[project.scripts]
gelation-sim = "gelation_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pycodestyle]
max-line-length = 79
